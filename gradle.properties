# تنظیمات پروژه راه‌یاب افغانستان
# مخزن گیت‌هاب برای User-Agent و نشانی manifest بسته‌های آفلاین
rahyabGithubRepo=kazemwafa2/rahyab_afghanistan

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
android.useAndroidX=true
android.nonTransitiveRClass=true

# مقاوم‌سازی شبکه: تلاش مجدد هنگام خطای ۴۲۹ سرورهای مخازن
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=1000
