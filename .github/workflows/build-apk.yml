name: Build APK

# ساخت APK راه‌یاب افغانستان.
#  - هر push به main و هر PR: ساخت آزمایشی (debug) و بارگذاری در Artifacts
#  - تگ v*: ساخت نسخه و انتشار در Releases
#  - اگر رازهای امضا (KEYSTORE_BASE64 و…) تنظیم شده باشد، نسخه release امضاشده ساخته می‌شود؛
#    ساخت آزمایشی نیز با نام ثابت Rahyab-Afghanistan.apk ارائه می‌شود؛
#    انتشار رسمی فقط با کلید دائمی امضای Release انجام می‌شود.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع ساخت'
        required: false
        default: 'debug'
        type: choice
        options: [debug, release]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify bundled map packages (base only)
        run: |
          n=$(find app/src/main/assets -type f -name '*.rahpkg.zip' | wc -l)
          echo "bundled map packages: $n"
          test -f app/src/main/assets/initial/afghanistan.rahpkg.zip || { echo "::error::national base package missing"; exit 1; }
          test "$n" -eq 1 || { echo "::error::only the national base package may be bundled; provincial packages must be hosted in GitHub Releases"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode signing key for release builds
        run: |
          WANT_RELEASE=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]] || [[ "${{ github.event.inputs.build_type }}" == "release" ]]; then
            WANT_RELEASE=true
          fi

          if [ "$WANT_RELEASE" = true ]; then
            for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
              if [ -z "${!name}" ]; then
                echo "::error::Missing GitHub Actions secret: $name"
                exit 1
              fi
            done
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "TASK=assembleRelease" >> "$GITHUB_ENV"
            echo "KIND=release" >> "$GITHUB_ENV"
          else
            echo "TASK=assembleDebug" >> "$GITHUB_ENV"
            echo "KIND=debug" >> "$GITHUB_ENV"
          fi

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build
        run: gradle "$TASK" --stacktrace

      - name: Collect APKs and checksums
        shell: bash
        run: |
          set -euo pipefail

          DIST_DIR="$GITHUB_WORKSPACE/dist"
          APK_DIR="$GITHUB_WORKSPACE/app/build/outputs/apk/$KIND"

          mkdir -p "$DIST_DIR"

          if [ ! -d "$APK_DIR" ]; then
            echo "::error::APK output directory not found: $APK_DIR"
            exit 1
          fi

          mapfile -d '' -t APK_FILES < <(
            find "$APK_DIR" -type f -name '*.apk' -print0
          )

          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "::error::No APK file was generated."
            exit 1
          fi

          # Publish one consistently named APK for both debug and release.
          SELECTED_APK=""
          for apk in "${APK_FILES[@]}"; do
            if [[ "$apk" == *universal*.apk ]]; then
              SELECTED_APK="$apk"
              break
            fi
          done
          if [ -z "$SELECTED_APK" ]; then
            SELECTED_APK="${APK_FILES[0]}"
          fi

          cp "$SELECTED_APK" "$DIST_DIR/Rahyab-Afghanistan.apk"
          find "$DIST_DIR" -maxdepth 1 -type f -name '*.apk' ! -name 'Rahyab-Afghanistan.apk' -delete

          cd "$DIST_DIR"

          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

          VERSION_CODE=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$GITHUB_WORKSPACE/app/build.gradle.kts" | head -n1)
          test -n "$VERSION_CODE" || { echo "::error::Could not read versionCode"; exit 1; }
          UNIVERSAL_APK=$(find . -maxdepth 1 -type f -name '*universal*.apk' | head -n1)
          if [ -z "$UNIVERSAL_APK" ]; then UNIVERSAL_APK=$(find . -maxdepth 1 -type f -name '*.apk' | head -n1); fi
          APK_SHA256=$(sha256sum "$UNIVERSAL_APK" | awk '{print $1}')
          {
            echo "Rahyab Afghanistan release"
            echo "versionCode: $VERSION_CODE"
            echo "sha256: $APK_SHA256"
            echo ""
            echo "The APK is signed with the project's permanent release key."
            echo "See SHA256SUMS.txt for checksums of all APK variants."
          } > "$GITHUB_WORKSPACE/release-notes.md"

      - name: Upload unit test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: Rahyab-Afghanistan-APK
          path: dist/*

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v') && env.KIND == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: true

      - name: Publish debug-signed test release (on tag without signing key)
        if: startsWith(github.ref, 'refs/tags/v') && env.KIND == 'debug'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: true
          body: |
            ⚠️ این انتشار با کلید امضای آزمایشی (debug) ساخته شده است و «نسخه رسمی» نیست.
            برای انتشار رسمی، رازهای KEYSTORE_BASE64 و KEYSTORE_PASSWORD و KEY_ALIAS و KEY_PASSWORD
            را مطابق docs/SIGNING.md تنظیم کنید و دوباره تگ بزنید.